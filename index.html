<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e3f2fd;
            font-family: 'Segoe UI', sans-serif;
        }
        .score-box {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 450px;
            margin: 60px auto;
        }
        .score-box h2 {
            color: #0277bd;
            font-weight: 600;
        }
        .score-box p {
            color: #555;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-calculate {
            background-color: #81d4fa;
            color: #000;
            font-weight: bold;
            border-radius: 10px;
        }
        .btn-calculate:hover {
            background-color: #4fc3f7;
        }
        .output-box {
            background-color: #bbdefb;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #0d47a1;
        }
        details {
            margin-top: 15px;
            margin-bottom: 20px;
        }
        summary {
            cursor: pointer;
            color: #0288d1;
        }
    </style>
</head>
<body>

    <div class="score-box">
        <h2 class="text-center">Score Analyzer</h2>
        <p class="text-center">Enter your grades to see your performance./p>

        <details ontoggle="showInstructions()">
            <summary><u>Instructions</u></summary>
            <p id="message">Click to reveal.</p>
        </details>

        <input type="number" id="filipino" class="form-control mb-2" placeholder="Filipino">
        <input type="number" id="english" class="form-control mb-2" placeholder="English">
        <input type="number" id="science" class="form-control mb-2" placeholder="Science">
        <input type="number" id="math" class="form-control mb-2" placeholder="Math">
        <input type="number" id="socialStudies" class="form-control mb-3" placeholder="Social Studies">

        <button type="button" class="btn btn-calculate w-100" onclick="analyzeScore()">Analyze</button>

        <div id="output" class="output-box">Your rating will appear here.</div>
    </div>

    <script>
        function showInstructions() {
            document.getElementById("message").innerHTML = "Enter your grades in all five subjects. Then click 'Analyze' to see your average.";
        }

        function analyzeScore() {
            let filipino = Number(document.getElementById("filipino").value);
            let english = Number(document.getElementById("english").value);
            let science = Number(document.getElementById("science").value);
            let math = Number(document.getElementById("math").value);
            let social = Number(document.getElementById("socialStudies").value);

            if (isNaN(filipino) || isNaN(english) || isNaN(science) || isNaN(math) || isNaN(social)) {
                document.getElementById("output").innerHTML = "⚠️ Please enter all your grades correctly.";
                return;
            }
            /**what isNaN does is check whether or not a value is a valid number https://www.w3schools.com/jsref/jsref_isnan.asp */

            let average = (filipino + english + science + math + social) / 5;
            let rating;

            switch (true) {
                case average >= 94:
                    rating = "🌟 Excellent";
                    break;
                case average >= 87:
                    rating = "👍 Above Satisfactory";
                    break;
                case average >= 80:
                    rating = "🙂 Satisfactory";
                    break;
                case average >= 75:
                    rating = "😐 Needs Improvement";
                    break;
                case average >= 70:
                    rating = "😕 Poor";
                    break;
                default:
                    rating = "❌ Failing Grade";
            }

            document.getElementById("output").innerHTML =
                "Average: " + average.toFixed(2) + "<br>Rating: " + rating;
        }
    </script>
</body>
</html>
